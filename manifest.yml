lzc-sdk-version: 0.1
name: 一号录播
package: cloud.lazycat.app.onerecord
version: 1.0.9
description: 专业的直播录制工具,随时回看精彩内容
homepage: https://bestlive.cc
author: bestlive
application:
    subdomain: onerecord
    routes:
        - /=http://onerecord:8080
    background_task: true

services:
    onerecord:
        # onerecord/onerecord:v1.0.9
        image: registry.lazycat.cloud/czyt/onerecord/onerecord:f476af12ea2af77f
        binds:
            - /lzcapp/var/config:/data/feiyu-live-server/config
            - /lzcapp/var/config/oneRecord:/root/.OneRecord
            - /lzcapp/var/logs:/root/.feiyu/logs
            - /lzcapp/var/config/aliyunpan:/data/feiyu-live-server/ali
            - /lzcapp/var/config/bypy:/root/.bypy
            - /lzcapp/var/data:/data/feiyu-live-server/data
        environment:
            - JVMPARAM=-Xms512m -Xmx1g
            - ACTIVEPROFILES=pro